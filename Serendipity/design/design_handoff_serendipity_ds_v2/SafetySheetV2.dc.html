<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<script src="./image-slot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--dq-bg:#101113;--dq-surface:#1A1B1E;--dq-surface-2:#24262A;--dq-text:#F6F7F8;--dq-text-2:#9BA0A8;--dq-text-3:#6A6F77;--dq-line:rgba(255,255,255,.09);--dq-line-strong:rgba(255,255,255,.18);--dq-track:rgba(255,255,255,.12);--dq-ember:#F2683C;--dq-danger:#E5484D;--dq-cta:#FFFFFF;--dq-cta-text:#15161A;--dq-shadow-sm:0 8px 22px rgba(0,0,0,.34)}
</style>
</helmet>
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" width="{{ frameW }}" height="{{ frameH }}" hint-size="393px,852px">
<div style="position:relative;height:100%;box-sizing:border-box;background:var(--dq-bg);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden">

  <div style="position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;padding:58px 16px 22px;opacity:.4">
    <div style="height:5px;border-radius:999px;background:var(--dq-track)"></div>
    <div style="flex:1;border-radius:28px;overflow:hidden;position:relative;background:var(--dq-surface-2)">
      <div style="position:absolute;inset:0;transform:scale(1.18);filter:blur(12px)"><image-slot id="partner-portrait" shape="rect" placeholder=""></image-slot></div>
    </div>
    <div style="height:96px;border-radius:24px;background:var(--dq-surface)"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(8,9,11,.66);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)"></div>

  <div style="position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:16px;padding:14px 16px 26px;border-radius:32px 32px 0 0;background:var(--dq-bg);border-top:1px solid var(--dq-line);box-shadow:0 -20px 50px rgba(0,0,0,.4)">
    <div style="align-self:center;width:40px;height:5px;border-radius:999px;background:var(--dq-track)"></div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font:800 22px/1.15 'Plus Jakarta Sans';letter-spacing:-.025em;color:var(--dq-text)">Safety options</span>
      <span style="font:500 12.5px/1.5 'Plus Jakarta Sans';color:var(--dq-text-2)">Nothing here notifies the other person, except ending the encounter.</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px">
      <sc-for list="{{ actions }}" as="act" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:13px;padding:16px 17px;border-radius:20px;background:var(--dq-surface);border:{{ act.border }}">
          <span style="width:34px;height:34px;border-radius:50%;background:{{ act.iconBg }};display:flex;align-items:center;justify-content:center;flex-shrink:0;font:600 14px/1 'Plus Jakarta Sans';color:{{ act.iconInk }}">{{ act.icon }}</span>
          <div style="flex:1;display:flex;flex-direction:column;gap:3px">
            <span style="font:700 14px/1 'Plus Jakarta Sans';letter-spacing:-.01em;color:{{ act.titleInk }}">{{ act.title }}</span>
            <span style="font:500 11.5px/1.4 'Plus Jakarta Sans';color:var(--dq-text-2)">{{ act.sub }}</span>
          </div>
          <span style="font:600 15px/1 'Plus Jakarta Sans';color:var(--dq-text-3);flex-shrink:0">›</span>
        </div>
      </sc-for>
    </div>

    <button style="height:52px;border:1px solid var(--dq-line-strong);border-radius:999px;background:transparent;color:var(--dq-text-2);font:600 14px/1 'Plus Jakarta Sans';cursor:pointer">Cancel</button>
  </div>

</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:852},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const neutral = {
      border: '1px solid var(--dq-line)',
      iconBg: 'var(--dq-surface-2)',
      iconInk: 'var(--dq-text)',
      titleInk: 'var(--dq-text)',
    };
    return {
      isDark: (this.props.mode ?? 'dark') === 'dark', frameW: 393, frameH: 852,
      actions: [
        {icon:'⛨', title:'Share live location', sub:'Send a 2-hour link to a trusted contact', ...neutral},
        {icon:'◍', title:'Check in later', sub:'We nudge you in 60 minutes', ...neutral},
        {icon:'✕', title:'End encounter', sub:'Re-blurs photos and closes the session', ...neutral},
        {icon:'!', title:'Report this person', sub:'Reviewed within 24 hours', border:'1px solid rgba(229,72,77,.34)', iconBg:'rgba(229,72,77,.14)', iconInk:'var(--dq-danger)', titleInk:'var(--dq-danger)'},
      ],
    };
  }
}
</script>
</body>
</html>
