<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<script src="./image-slot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--dq-bg:#101113;--dq-surface:#1A1B1E;--dq-surface-2:#24262A;--dq-text:#F6F7F8;--dq-text-2:#9BA0A8;--dq-text-3:#6A6F77;--dq-line:rgba(255,255,255,.09);--dq-line-strong:rgba(255,255,255,.18);--dq-track:rgba(255,255,255,.12);--dq-ember:#F2683C;--dq-ember-soft:rgba(242,104,60,.16);--dq-ember-line:rgba(242,104,60,.38);--dq-ember-text:#FF8A5F;--dq-ember-glow:rgba(242,104,60,.32);--dq-verify:#2E9BF0;--dq-live:#4ADE80;--dq-live-text:#4ADE80;--dq-danger:#E5484D;--dq-cta:#FFFFFF;--dq-cta-text:#15161A;--dq-bronze:#C08457;--dq-silver:#B9C0CA;--dq-gold:#E8B44A;--dq-platinum-ink:#D9E6F2;--dq-platinum-fill:rgba(217,230,242,.14);--dq-shadow:0 22px 48px rgba(0,0,0,.5);--dq-shadow-sm:0 8px 22px rgba(0,0,0,.34)}
@keyframes dqLive{0%,100%{opacity:1}50%{opacity:.28}}
</style>
</helmet>
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" width="{{ frameW }}" height="{{ frameH }}" hint-size="393px,852px">
<div style="height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;padding:58px 16px 22px;background:var(--dq-bg);color:var(--dq-text);font-family:'Plus Jakarta Sans',system-ui,sans-serif">

  <div style="display:flex;align-items:center;justify-content:space-between">
    <div style="width:38px;height:38px;border-radius:50%;background:var(--dq-surface);border:1px solid var(--dq-line);display:flex;align-items:center;justify-content:center;box-shadow:var(--dq-shadow-sm)"><span style="font:600 15px/1 'Plus Jakarta Sans';color:var(--dq-text)">←</span></div>
    <span style="font:700 11px/1 'Plus Jakarta Sans';letter-spacing:.18em;text-transform:uppercase;color:var(--dq-text-2)">{{ gameTitle }}</span>
    <div style="width:38px;height:38px;border-radius:50%;background:var(--dq-surface);border:1px solid var(--dq-line);display:flex;align-items:center;justify-content:center;box-shadow:var(--dq-shadow-sm)"><span style="font:700 14px/1 'Plus Jakarta Sans';color:var(--dq-text)">⋯</span></div>
  </div>

  <!-- PARTNER STRIP -->
  <div style="display:flex;align-items:center;gap:13px;padding:12px;border-radius:24px;background:var(--dq-surface);border:1px solid var(--dq-line);box-shadow:var(--dq-shadow-sm)">
    <div style="position:relative;width:62px;height:62px;border-radius:18px;overflow:hidden;flex-shrink:0;background:var(--dq-surface-2)">
      <div style="position:absolute;inset:0;transform:scale(1.22);filter:blur({{ blurStr }})"><image-slot id="partner-portrait" shape="rect" placeholder="partner"></image-slot></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font:700 14px/1 'Plus Jakarta Sans';letter-spacing:-.01em;color:var(--dq-text)">Someone nearby</span>
        <span style="display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:var(--dq-surface-2);border:1px solid var(--dq-line);font:700 9px/1 'Plus Jakarta Sans';color:var(--dq-text-2)"><span style="color:var(--dq-gold);font-size:9px">◆</span>Gold</span>
      </div>
      <div style="display:flex;align-items:center;gap:9px">
        <span style="font:700 9px/1 'Plus Jakarta Sans';letter-spacing:.16em;text-transform:uppercase;color:var(--dq-text-3)">Reveal</span>
        <div style="flex:1;height:5px;border-radius:999px;background:var(--dq-track);overflow:hidden"><div style="height:100%;width:{{ revealPct }}%;border-radius:999px;background:var(--dq-ember)"></div></div>
        <span style="font:800 11px/1 'Plus Jakarta Sans';color:var(--dq-ember-text)">{{ revealPct }}%</span>
      </div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div style="display:flex;align-items:center;justify-content:space-between">
    <span style="font:600 10px/1 'Plus Jakarta Sans';letter-spacing:.14em;text-transform:uppercase;color:var(--dq-text-2)">{{ progressLabel }}</span>
    <div style="display:flex;gap:5px">
      <sc-for list="{{ pips }}" as="pip" hint-placeholder-count="3">
        <span style="width:18px;height:5px;border-radius:999px;background:{{ pip.bg }}"></span>
      </sc-for>
    </div>
  </div>

  <!-- TRIVIA -->
  <sc-if value="{{ isTrivia }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1;display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:28px;background:var(--dq-surface);border:1px solid var(--dq-line);box-shadow:var(--dq-shadow-sm)">
      <span style="font:600 9px/1 'Plus Jakarta Sans';letter-spacing:.2em;text-transform:uppercase;color:var(--dq-text-3)">Mutual prompt</span>
      <span style="font:800 21px/1.3 'Plus Jakarta Sans';letter-spacing:-.02em;color:var(--dq-text);text-wrap:pretty">Sunday reset — which sounds more like you?</span>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:2px">
        <sc-for list="{{ options }}" as="opt" hint-placeholder-count="4">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-radius:20px;background:{{ opt.bg }};border:{{ opt.border }}">
            <span style="font:{{ opt.font }} 14px/1.25 'Plus Jakarta Sans';color:{{ opt.ink }}">{{ opt.text }}</span>
            <span style="flex-shrink:0;{{ opt.markStyle }}">{{ opt.mark }}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <!-- WORD CHAIN -->
  <sc-if value="{{ isChain }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:28px;background:var(--dq-surface);border:1px solid var(--dq-line);box-shadow:var(--dq-shadow-sm)">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span style="font:600 9px/1 'Plus Jakarta Sans';letter-spacing:.2em;text-transform:uppercase;color:var(--dq-text-3)">Shared chain</span>
        <span style="padding:6px 11px;border-radius:999px;background:var(--dq-ember-soft);border:1px solid var(--dq-ember-line);font:700 9.5px/1 'Plus Jakarta Sans';letter-spacing:.08em;text-transform:uppercase;color:var(--dq-ember-text)">Streak 4</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">
        <sc-for list="{{ chain }}" as="link" hint-placeholder-count="5">
          <span style="padding:10px 14px;border-radius:999px;background:{{ link.bg }};border:{{ link.border }};font:{{ link.font }} 13px/1 'Plus Jakarta Sans';color:{{ link.ink }}">{{ link.word }}</span>
        </sc-for>
      </div>
      <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
        <span style="font:600 9px/1 'Plus Jakarta Sans';letter-spacing:.16em;text-transform:uppercase;color:var(--dq-text-2)">Link a word to “Jazz”</span>
        <div style="display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;border-radius:999px;background:var(--dq-surface-2);border:1.5px solid var(--dq-ember)">
          <span style="flex:1;font:600 15px/1 'Plus Jakarta Sans';color:var(--dq-text)">Saxophone</span>
          <div style="width:42px;height:42px;border-radius:50%;background:var(--dq-ember);display:flex;align-items:center;justify-content:center;font:700 17px/1 'Plus Jakarta Sans';color:#fff;box-shadow:0 8px 20px var(--dq-ember-glow)">↑</div>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- FEEDBACK -->
  <div style="display:flex;align-items:center;gap:10px;padding:12px 15px;border-radius:18px;background:var(--dq-ember-soft);border:1px solid var(--dq-ember-line)">
    <span style="width:20px;height:20px;border-radius:50%;background:var(--dq-ember);display:flex;align-items:center;justify-content:center;font:800 11px/1 'Plus Jakarta Sans';color:#fff;flex-shrink:0">✓</span>
    <span style="font:700 11.5px/1.35 'Plus Jakarta Sans';color:var(--dq-ember-text)">{{ feedback }}</span>
  </div>

  <button style="height:54px;border:none;border-radius:999px;background:var(--dq-cta);color:var(--dq-cta-text);font:700 15px/1 'Plus Jakarta Sans';cursor:pointer;box-shadow:var(--dq-shadow-sm)">{{ cta }}</button>

</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:852},&quot;game&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;trivia&quot;,&quot;chain&quot;],&quot;default&quot;:&quot;trivia&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const game = this.props.game ?? 'trivia';
    const isTrivia = game === 'trivia';
    const p = isTrivia ? 0.3 : 0.5;
    const opt = (text, state, mark) => ({
      text,
      bg: state === 'on' ? 'var(--dq-ember-soft)' : 'var(--dq-surface-2)',
      border: state === 'on' ? '1.5px solid var(--dq-ember)' : '1px solid var(--dq-line)',
      font: state === 'on' ? '700' : '600',
      ink: 'var(--dq-text)',
      mark,
      markStyle: state === 'on'
        ? 'width:22px;height:22px;border-radius:50%;background:var(--dq-ember);display:flex;align-items:center;justify-content:center;font:800 12px/1 Plus Jakarta Sans;color:#fff'
        : "font:600 12px/1 'IBM Plex Mono';color:var(--dq-text-3)",
    });
    const link = (word, who) => ({
      word,
      bg: who === 'you' ? 'var(--dq-ember-soft)' : 'var(--dq-surface-2)',
      border: who === 'you' ? '1px solid var(--dq-ember-line)' : '1px solid var(--dq-line)',
      font: who === 'open' ? '700' : '600',
      ink: 'var(--dq-text)',
    });
    return {
      isDark: (this.props.mode ?? 'dark') === 'dark', frameW: 393, frameH: 852,
      isTrivia, isChain: !isTrivia,
      gameTitle: isTrivia ? 'Trivia' : 'Word chain',
      blurStr: Math.round(40 * (1 - p)) + 'px', revealPct: Math.round(p * 100),
      progressLabel: isTrivia ? 'Question 2 of 3' : '6 links · both playing',
      pips: isTrivia
        ? [{bg:'var(--dq-ember)'},{bg:'var(--dq-ember)'},{bg:'var(--dq-track)'}]
        : [{bg:'var(--dq-ember)'},{bg:'var(--dq-ember)'},{bg:'var(--dq-ember)'},{bg:'var(--dq-ember)'},{bg:'var(--dq-track)'}],
      options: [
        opt('Long walk, no phone', 'off', 'A'),
        opt('Darkroom + a record on', 'on', '✓'),
        opt('Farmers market run', 'off', 'C'),
        opt('Long brunch, no plans', 'off', 'D'),
      ],
      chain: [link('Rain','them'), link('Umbrella','you'), link('London','them'), link('Fog','you'), link('Jazz','open')],
      feedback: isTrivia ? 'Matched — you both picked B · +8% reveal' : 'Strong link · +8% reveal · streak 5',
      cta: isTrivia ? 'Next question' : 'Send word',
    };
  }
}
</script>
</body>
</html>
