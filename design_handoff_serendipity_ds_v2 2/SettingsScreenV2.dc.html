<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--dq-bg:#101113;--dq-surface:#1A1B1E;--dq-surface-2:#24262A;--dq-text:#F6F7F8;--dq-text-2:#9BA0A8;--dq-text-3:#6A6F77;--dq-line:rgba(255,255,255,.09);--dq-line-strong:rgba(255,255,255,.18);--dq-track:rgba(255,255,255,.12);--dq-ember:#F2683C;--dq-ember-soft:rgba(242,104,60,.16);--dq-ember-line:rgba(242,104,60,.38);--dq-ember-text:#FF8A5F;--dq-ember-glow:rgba(242,104,60,.32);--dq-verify:#2E9BF0;--dq-live:#4ADE80;--dq-danger:#E5484D;--dq-cta:#FFFFFF;--dq-cta-text:#15161A;--dq-bronze:#C08457;--dq-silver:#B9C0CA;--dq-gold:#E8B44A;--dq-platinum-ink:#D9E6F2;--dq-platinum-fill:rgba(217,230,242,.14);--dq-shadow:0 22px 48px rgba(0,0,0,.5);--dq-shadow-sm:0 8px 22px rgba(0,0,0,.34)}
</style>
</helmet>
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" width="{{ frameW }}" height="{{ frameH }}" hint-size="393px,852px">
<div style="height:100%;box-sizing:border-box;display:flex;flex-direction:column;background:var(--dq-bg);color:var(--dq-text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow:hidden">

  <div style="display:flex;align-items:center;gap:12px;padding:56px 16px 12px;flex-shrink:0">
    <div style="width:38px;height:38px;border-radius:50%;background:var(--dq-surface);border:1px solid var(--dq-line);display:flex;align-items:center;justify-content:center;font:600 15px/1 'Plus Jakarta Sans';color:var(--dq-text)">←</div>
    <span style="flex:1;font:800 21px/1 'Plus Jakarta Sans';letter-spacing:-.025em;color:var(--dq-text)">Settings</span>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;gap:20px;padding:4px 16px 26px;overflow:hidden">

    <div style="display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:24px;background:var(--dq-surface);border:1px solid var(--dq-line)">
      <div style="width:48px;height:48px;border-radius:50%;border:2px solid var(--dq-ember);background:var(--dq-surface-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font:700 17px/1 'Plus Jakarta Sans';color:var(--dq-text-2)">A</div>
      <div style="flex:1;display:flex;flex-direction:column;gap:4px">
        <div style="display:flex;align-items:center;gap:7px">
          <span style="font:700 16px/1 'Plus Jakarta Sans';letter-spacing:-.015em;color:var(--dq-text)">Alex</span>
          <span style="width:16px;height:16px;border-radius:50%;background:var(--dq-verify);display:flex;align-items:center;justify-content:center;font:800 9px/1 'Plus Jakarta Sans';color:#fff">✓</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font:700 10.5px/1 'Plus Jakarta Sans';color:var(--dq-gold)">◆</span>
          <span style="font:600 10.5px/1 'Plus Jakarta Sans';letter-spacing:.14em;text-transform:uppercase;color:var(--dq-text-2)">Gold · 4.4 avg</span>
        </div>
      </div>
      <span style="font:600 15px/1 'Plus Jakarta Sans';color:var(--dq-text-3)">›</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px">
      <span style="font:600 9.5px/1 'Plus Jakarta Sans';letter-spacing:.2em;text-transform:uppercase;color:var(--dq-text-3);padding-left:18px">Discovery</span>
      <div style="display:flex;flex-direction:column;border-radius:24px;background:var(--dq-surface);border:1px solid var(--dq-line);overflow:hidden">
        <div style="display:flex;align-items:center;gap:14px;min-height:56px;padding:14px 18px">
          <div style="flex:1;display:flex;flex-direction:column;gap:3px">
            <span style="font:600 14px/1.3 'Plus Jakarta Sans';color:var(--dq-text)">Discoverable</span>
            <span style="font:500 11.5px/1.35 'Plus Jakarta Sans';color:var(--dq-text-2)">6 people can see your signal now</span>
          </div>
          <div style="width:51px;height:31px;border-radius:999px;background:var(--dq-ember);position:relative;flex-shrink:0"><div style="position:absolute;top:2px;left:22px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.28)"></div></div>
        </div>
        <div style="height:1px;background:var(--dq-line);margin-left:18px"></div>
        <div style="display:flex;flex-direction:column;gap:11px;padding:16px 18px">
          <div style="display:flex;align-items:baseline;justify-content:space-between">
            <span style="font:600 14px/1 'Plus Jakarta Sans';color:var(--dq-text)">Encounter radius</span>
            <span style="font:500 13px/1 'IBM Plex Mono';color:var(--dq-ember-text)">120 m</span>
          </div>
          <div style="position:relative;height:6px;border-radius:999px;background:var(--dq-track)">
            <div style="position:absolute;top:0;left:0;height:6px;width:42%;border-radius:999px;background:var(--dq-ember)"></div>
            <div style="position:absolute;top:-8px;left:42%;margin-left:-11px;width:22px;height:22px;border-radius:50%;background:var(--dq-surface);border:1px solid var(--dq-line);box-shadow:var(--dq-shadow-sm)"></div>
          </div>
        </div>
        <div style="height:1px;background:var(--dq-line);margin-left:18px"></div>
        <div style="display:flex;align-items:center;gap:14px;min-height:56px;padding:14px 18px">
          <span style="flex:1;font:600 14px/1.3 'Plus Jakarta Sans';color:var(--dq-text)">Pause zones</span>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
            <span style="font:500 13px/1 'IBM Plex Mono';color:var(--dq-text-2)">3</span>
            <span style="font:600 15px/1 'Plus Jakarta Sans';color:var(--dq-text-3)">›</span>
          </div>
        </div>
      </div>
      <span style="font:500 11px/1.45 'Plus Jakarta Sans';color:var(--dq-text-3);padding:0 18px">Inside a pause zone you are invisible, and no one is told you were there.</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px">
      <span style="font:600 9.5px/1 'Plus Jakarta Sans';letter-spacing:.2em;text-transform:uppercase;color:var(--dq-text-3);padding-left:18px">Show me</span>
      <div style="display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--dq-surface-2)">
        <span style="flex:1;text-align:center;padding:11px 0;border-radius:12px;background:var(--dq-cta);font:700 12.5px/1 'Plus Jakarta Sans';color:var(--dq-cta-text)">Everyone</span>
        <span style="flex:1;text-align:center;padding:11px 0;border-radius:12px;font:600 12.5px/1 'Plus Jakarta Sans';color:var(--dq-text-2)">Women</span>
        <span style="flex:1;text-align:center;padding:11px 0;border-radius:12px;font:600 12.5px/1 'Plus Jakarta Sans';color:var(--dq-text-2)">Men</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px">
      <span style="font:600 9.5px/1 'Plus Jakarta Sans';letter-spacing:.2em;text-transform:uppercase;color:var(--dq-text-3);padding-left:18px">Account</span>
      <div style="display:flex;flex-direction:column;border-radius:24px;background:var(--dq-surface);border:1px solid var(--dq-line);overflow:hidden">
        <div style="display:flex;align-items:center;min-height:56px;padding:14px 18px"><span style="flex:1;font:600 14px/1.3 'Plus Jakarta Sans';color:var(--dq-text)">Your data</span><span style="font:600 15px/1 'Plus Jakarta Sans';color:var(--dq-text-3)">›</span></div>
        <div style="height:1px;background:var(--dq-line);margin-left:18px"></div>
        <div style="display:flex;align-items:center;min-height:56px;padding:14px 18px"><span style="flex:1;font:600 14px/1.3 'Plus Jakarta Sans';color:var(--dq-danger)">Delete account</span><span style="font:600 15px/1 'Plus Jakarta Sans';color:var(--dq-text-3)">›</span></div>
      </div>
    </div>

  </div>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:852},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { isDark: (this.props.mode ?? 'dark') === 'dark', frameW: 393, frameH: 852 };
  }
}
</script>
</body>
</html>
